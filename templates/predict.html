<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:50%;
            margin:auto;
            margin-top:30px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
        }

        input,select{
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:#27ae60;
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#219150;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Loan Prediction Form</h2>

<form action="/result" method="POST">

    <label>Gender</label>
    <select name="Gender">
        <option value="1">Male</option>
        <option value="0">Female</option>
    </select>

    <label>Married</label>
    <select name="Married">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>Dependents</label>
    <input type="number" name="Dependents" required>

    <label>Education</label>
    <select name="Education">
        <option value="1">Graduate</option>
        <option value="0">Not Graduate</option>
    </select>

    <label>Self Employed</label>
    <select name="Self_Employed">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>Applicant Income</label>
    <input type="number" name="ApplicantIncome" required>

    <label>Coapplicant Income</label>
    <input type="number" name="CoapplicantIncome" required>

    <label>Loan Amount</label>
    <input type="number" name="LoanAmount" required>

    <label>Loan Amount Term</label>
    <input type="number" name="Loan_Amount_Term" required>

    <label>Credit History</label>
    <select name="Credit_History">
        <option value="1">Good (1)</option>
        <option value="0">Bad (0)</option>
    </select>

    <label>Property Area</label>
    <select name="Property_Area">
        <option value="2">Urban</option>
        <option value="1">Semiurban</option>
        <option value="0">Rural</option>
    </select>

    <br><br>

    <button type="submit">
        Predict Loan Status
    </button>

</form>

</div>

</body>
</html>
