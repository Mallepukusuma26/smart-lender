<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>

        body{
            font-family:Arial;
            text-align:center;
            background:#f4f4f4;
            padding-top:100px;
        }

        .box{
            background:white;
            width:40%;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            color:#2c3e50;
        }

        .btn{
            text-decoration:none;
            background:#3498db;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Prediction Result</h1>

    <h2>{{ prediction }}</h2>

    <br>

    <a href="/" class="btn">
        Predict Again
    </a>

</div>

</body>
</html>
